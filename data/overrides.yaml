# Manual fixes, applied by `python -m pipeline cluster` and `render`.
# Pages use the labels from the scan filenames: "recetario _12.jpg" -> "12", "recetario _157_1.jpg" -> "157-1".
# A page can hold several recipes: "157#2" is the second one on page 157; a bare "157" means "157#1".
# cache/review.md lists the refs. After editing, run: python -m pipeline cluster, then consolidate, then render.

# Items that are the same recipe (one ref from each copy/part is enough).
merge:
  - ["7#1", "11#1"]
  - ["50#1", "53#1"]
  - ["69#1", "105#1"]
  - ["85#1", "116#3"]
  - ["104#2", "123#1"]
  - ["104#2", "131#2"]
  - ["111#1", "113#1"]
  - ["69#1", "133#1"]
  - ["94#1", "135#1"]
  - ["101#1", "136#1"]
  - ["102#1", "137#1"]

# Items cluster merged (same title, similar ingredients) that are different recipes.
keep_apart: []
#  - ["30", "31"]

# Start a new recipe at this item instead of treating it as a continuation.
split:
  - "11#1"


# Whole pages ("3") or single items ("157#2") to ignore.
drop: []

# Force an item's kind: recipe | tip
kind: {}
#  "45": tip

# Recipes checked by hand against the scan: `python -m pipeline verify` stops reporting them.
verified:
  # Verify's typed-recipe parser treats everything between "INGREDIENTES:" and
  # "PROCEDIMIENTO:" as an ingredient line; on this page that range also has the
  # assembly instructions ("Se une la gel. ... con ...", "Se decora con ..."),
  # which the recipe correctly keeps as steps instead of ingredients (checked
  # against pictures/recetario _200.jpg).
  - "200#1"
  # Audit 2026-09: agent notes cite page numbers / uncertain digits, and sub-headings
  # ("Aliño:", "Para decorar:") are read by verify as ingredients; checked against the scans.
  - "71#1"
  - "77#1"
  - "79#1"
  - "80#1"
  - "90#1"
  - "92#1"
  - "111#1"
  - "257#1"
  - "259#1"
  - "278#1"
  - "279#1"
  - "281#1"
  - "282#2"
  - "284#1"
  - "286#1"
  - "287#1"
#  - "7#1"

# Correct a consolidated recipe, keyed by its id (first ref, as in cache/clusters.json).
# Render-only, no API call.
fix: {}
